<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="TikTok to MP3 audio extraction guide cover">
  <defs>
    <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7928ca" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff0080" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7928ca"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#mesh)"/>

  <circle cx="100" cy="90" r="72" fill="none" stroke="#ec4899" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="700" cy="360" r="96" fill="none" stroke="#7928ca" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Left: video -->
  <rect x="120" y="110" width="220" height="240" rx="20" fill="#171717"/>
  <circle cx="230" cy="230" r="44" fill="#ffffff" fill-opacity="0.15"/>
  <path d="M218 210v40l34-20z" fill="#ffffff"/>
  <rect x="140" y="296" width="120" height="12" rx="6" fill="#e4e4e7"/>
  <rect x="140" y="316" width="80" height="12" rx="6" fill="#e4e4e7"/>

  <!-- Arrow -->
  <path d="M360 230h50m-12-12l12 12-12 12" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Right: MP3 card -->
  <rect x="440" y="90" width="240" height="280" rx="20" fill="#ffffff" fill-opacity="0.97"/>
  <rect x="470" y="120" width="180" height="40" rx="12" fill="url(#btn)"/>
  <text x="560" y="145" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MP3</text>

  <!-- Equalizer bars -->
  <g transform="translate(480,200)">
    <rect x="0" y="30" width="14" height="60" rx="4" fill="url(#btn)"/>
    <rect x="24" y="10" width="14" height="80" rx="4" fill="url(#btn)" fill-opacity="0.85"/>
    <rect x="48" y="22" width="14" height="68" rx="4" fill="url(#btn)"/>
    <rect x="72" y="2" width="14" height="88" rx="4" fill="url(#btn)" fill-opacity="0.7"/>
    <rect x="96" y="40" width="14" height="50" rx="4" fill="url(#btn)" fill-opacity="0.9"/>
    <rect x="120" y="16" width="14" height="74" rx="4" fill="url(#btn)"/>
  </g>

  <!-- 320 kbps badge -->
  <rect x="470" y="318" width="180" height="28" rx="14" fill="#171717"/>
  <text x="560" y="336" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Up to 320kbps quality</text>
</svg>
