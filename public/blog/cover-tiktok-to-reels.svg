<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Cross-posting TikTok videos to Instagram Reels without shadowban guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f2ea" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#ff0050" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#feda75" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4f5bd5" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="tiktok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f2ea"/>
      <stop offset="0.5" stop-color="#ff0050"/>
      <stop offset="1" stop-color="#00f2ea"/>
    </linearGradient>
    <linearGradient id="ig-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset="0.35" stop-color="#f77737"/>
      <stop offset="0.7" stop-color="#d62976"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>

  <!-- TikTok phone (left) -->
  <rect x="80" y="60" width="210" height="330" rx="28" fill="#171717"/>
  <rect x="90" y="70" width="190" height="310" rx="20" fill="#000000"/>
  <!-- TikTok play icon -->
  <circle cx="185" cy="200" r="36" fill="url(#tiktok-grad)" fill-opacity="0.9"/>
  <path d="M176 178v44l36-22z" fill="#ffffff"/>
  <!-- TikTok note symbol -->
  <text x="238" y="145" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="url(#tiktok-grad)" opacity="0.35">♪</text>
  <!-- Bottom bar -->
  <rect x="90" y="330" width="190" height="50" fill="#ffffff"/>
  <circle cx="115" cy="355" r="8" fill="url(#tiktok-grad)"/>
  <rect x="132" y="348" width="90" height="12" rx="6" fill="#e4e4e7"/>
  <rect x="132" y="366" width="60" height="10" rx="5" fill="#e4e4e7"/>

  <!-- Arrow -->
  <g transform="translate(310,200)">
    <rect x="0" y="-22" width="80" height="44" rx="22" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M20 0l20 14V-14z" fill="#ff0050"/>
    <path d="M48 0l14-14M48 0l14 14" stroke="#00f2ea" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Instagram phone (right) -->
  <rect x="410" y="60" width="210" height="330" rx="28" fill="#171717"/>
  <rect x="420" y="70" width="190" height="310" rx="20" fill="url(#ig-grad)" fill-opacity="0.08"/>
  <!-- Reel player -->
  <rect x="420" y="70" width="190" height="200" rx="20" fill="#111111"/>
  <circle cx="515" cy="170" r="36" fill="url(#ig-grad)"/>
  <path d="M505 150v40l36-20z" fill="#ffffff"/>
  <!-- No-watermark badge -->
  <rect x="435" y="280" width="160" height="38" rx="19" fill="#22c55e" fill-opacity="0.9"/>
  <text x="515" y="304" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">No Shadowban ✓</text>
  <!-- IG bottom bar -->
  <rect x="420" y="330" width="190" height="50" fill="#ffffff"/>
  <circle cx="445" cy="355" r="8" fill="url(#ig-grad)"/>
  <rect x="462" y="348" width="90" height="12" rx="6" fill="#e4e4e7"/>
  <rect x="462" y="366" width="60" height="10" rx="5" fill="#e4e4e7"/>

  <!-- Title badge (center top) -->
  <rect x="220" y="24" width="360" height="42" rx="21" fill="#ffffff" fill-opacity="0.95"/>
  <text x="400" y="51" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#18181b" text-anchor="middle">TikTok → Reels (No Shadowban)</text>

  <!-- Feature cards -->
  <rect x="50" y="400" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.9"/>
  <text x="130" y="422" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">1080p HD</text>

  <rect x="230" y="400" width="180" height="36" rx="18" fill="#ffffff" fill-opacity="0.9"/>
  <text x="320" y="422" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">Zero Watermark</text>

  <rect x="430" y="400" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.9"/>
  <text x="510" y="422" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">Trending Audio</text>

  <rect x="610" y="400" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.9"/>
  <text x="690" y="422" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">2026 Updated</text>
</svg>