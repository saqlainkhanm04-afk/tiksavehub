<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Instagram Reels and video downloader saving HD videos without watermark on any device">
  <defs>
    <linearGradient id="ig-mesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#feda75" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#d62976" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4f5bd5" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ig-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset="0.4" stop-color="#f77737"/>
      <stop offset="0.7" stop-color="#d62976"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <linearGradient id="ig-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d62976"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <linearGradient id="ig-video" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="ig-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#d62976" flood-opacity="0.25"/>
    </filter>
    <filter id="ig-chip" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="28" fill="url(#ig-mesh)"/>

  <!-- Decorative rings -->
  <circle cx="120" cy="80" r="110" fill="none" stroke="#d62976" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="690" cy="380" r="130" fill="none" stroke="#4f5bd5" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="700" cy="60" r="46" fill="#feda75" fill-opacity="0.12"/>
  <circle cx="100" cy="380" r="36" fill="#4f5bd5" fill-opacity="0.12"/>

  <!-- Title -->
  <text x="400" y="52" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#d62976" letter-spacing="1.2" text-anchor="middle">INSTAGRAM REELS &amp; VIDEO DOWNLOADER</text>
  <text x="400" y="78" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#3f3f46" letter-spacing="-0.3" text-anchor="middle">Download Reels &amp; Videos in HD — No Watermark</text>

  <!-- Phone frame -->
  <g filter="url(#ig-soft)">
    <rect x="285" y="120" width="230" height="330" rx="30" fill="#111111"/>
    <rect x="297" y="132" width="206" height="306" rx="22" fill="#ffffff"/>
    <rect x="365" y="142" width="70" height="6" rx="3" fill="#111111"/>
  </g>

  <!-- Video preview inside phone -->
  <clipPath id="ig-screen">
    <rect x="297" y="132" width="206" height="306" rx="22"/>
  </clipPath>
  <g clip-path="url(#ig-screen)">
    <rect x="297" y="132" width="206" height="306" fill="url(#ig-video)"/>
    <rect x="297" y="132" width="206" height="306" fill="url(#ig-mesh)" opacity="0.35"/>
    <circle cx="400" cy="252" r="60" fill="url(#ig-brand)" opacity="0.9"/>
    <path d="M386 222v60l52-30z" fill="#ffffff"/>
    <!-- reel strip -->
    <rect x="297" y="396" width="206" height="42" fill="#000000" fill-opacity="0.55"/>
    <circle cx="322" cy="417" r="9" fill="url(#ig-brand)"/>
    <rect x="342" y="411" width="86" height="12" rx="6" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="342" y="428" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>
    <path d="M470 409l14 8-14 8z" fill="#ffffff" fill-opacity="0.9"/>
    <!-- like / comment -->
    <path d="M330 300h140l-12 16 12 16H340a10 10 0 0 1-10-10v-22z" fill="#ffffff" fill-opacity="0.92"/>
  </g>

  <!-- Download chip under phone -->
  <g filter="url(#ig-chip)">
    <rect x="330" y="392" width="140" height="40" rx="20" fill="url(#ig-btn)"/>
    <text x="400" y="417" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.2">Download HD</text>
  </g>

  <!-- Badge: No Watermark -->
  <g filter="url(#ig-chip)">
    <rect x="80" y="180" width="150" height="52" rx="14" fill="#ffffff"/>
    <rect x="94" y="194" width="24" height="24" rx="8" fill="url(#ig-brand)"/>
    <path d="M100 206l5 5 9-10" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="206" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">No Watermark</text>
    <text x="128" y="223" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#71717a">Clean MP4 output</text>
  </g>

  <!-- Badge: HD 1080p -->
  <g filter="url(#ig-chip)">
    <rect x="80" y="252" width="150" height="52" rx="14" fill="#ffffff"/>
    <rect x="94" y="266" width="24" height="24" rx="8" fill="url(#ig-brand)"/>
    <text x="106" y="283" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">HD</text>
    <text x="128" y="278" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">1080p Quality</text>
    <text x="128" y="295" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#71717a">Original resolution</text>
  </g>

  <!-- Badge: Free & Fast -->
  <g filter="url(#ig-chip)">
    <rect x="80" y="324" width="150" height="52" rx="14" fill="#ffffff"/>
    <rect x="94" y="338" width="24" height="24" rx="8" fill="url(#ig-brand)"/>
    <path d="M104 350l10 0m0 0l-3 3m3-3l-3-3" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="350" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Free &amp; Instant</text>
    <text x="128" y="367" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#71717a">No sign-up needed</text>
  </g>

  <!-- Right panel: steps -->
  <g filter="url(#ig-chip)">
    <rect x="575" y="150" width="170" height="190" rx="16" fill="#ffffff"/>
    <text x="595" y="182" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#18181b" letter-spacing="-0.2">How it works</text>
    <circle cx="606" cy="206" r="11" fill="url(#ig-brand)"/>
    <text x="606" y="210" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="626" y="211" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#3f3f46">Copy the reel link</text>
    <circle cx="606" cy="248" r="11" fill="url(#ig-brand)"/>
    <text x="606" y="252" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="626" y="253" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#3f3f46">Paste into the tool</text>
    <circle cx="606" cy="290" r="11" fill="url(#ig-brand)"/>
    <text x="606" y="294" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="626" y="295" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#3f3f46">Save HD video</text>
  </g>

  <!-- CTA pill right -->
  <g filter="url(#ig-chip)">
    <rect x="575" y="360" width="170" height="46" rx="23" fill="url(#ig-btn)"/>
    <text x="660" y="388" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.2">Try it free &#8594;</text>
  </g>

  <!-- Instagram glyph watermark -->
  <g transform="translate(30,420)">
    <rect x="0" y="0" width="24" height="24" rx="7" fill="none" stroke="#d62976" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="12" cy="12" r="5" fill="none" stroke="#d62976" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="18.5" cy="5.5" r="1.6" fill="#d62976" fill-opacity="0.5"/>
  </g>
  <text x="66" y="436" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d62976" fill-opacity="0.6">TikSaveHub</text>
</svg>
