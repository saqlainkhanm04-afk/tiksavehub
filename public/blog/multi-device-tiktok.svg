  <!-- Device labels -->
  <text x="217" y="438" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">Phone</text>
  <text x="417" y="430" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">Tablet</text>
  <text x="660" y="438" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">PC / Mac</text>

  <text x="400" y="58" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" letter-spacing="0.5">WORKS ON EVERY DEVICE</text>
</svg>