<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="iPhone TikTok app copying a video link">
  <defs>
    <linearGradient id="cmesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7928ca" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#007cf0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00dfd8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cbtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#007cf0"/>
      <stop offset="1" stop-color="#00dfd8"/>
    </linearGradient>
    <linearGradient id="cnote" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0080"/>
      <stop offset="1" stop-color="#00dfd8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#cmesh)"/>

  <!-- Phone -->
  <rect x="110" y="70" width="180" height="320" rx="28" fill="#171717"/>
  <rect x="122" y="82" width="156" height="282" rx="20" fill="#ffffff"/>
  <rect x="158" y="96" width="84" height="12" rx="6" fill="#e4e4e7"/>

  <!-- TikTok-ish musical note inside phone -->
  <circle cx="160" cy="160" r="20" fill="url(#cnote)"/>
  <path d="M172 140v34m0 0a10 10 0 1 1-3.5-7.6M182 134v26" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>

  <rect x="134" y="252" width="132" height="14" rx="7" fill="#e4e4e7"/>
  <rect x="134" y="276" width="100" height="14" rx="7" fill="#e4e4e7"/>

  <!-- Copy link toast -->
  <rect x="130" y="318" width="140" height="34" rx="17" fill="url(#cbtn)"/>
  <text x="200" y="340" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Copied</text>

  <!-- Arrow -->
  <path d="M300 240h18m-7-7l7 7-7 7" stroke="#c4c4c4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Steps panel -->
  <rect x="330" y="100" width="400" height="70" rx="16" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7" stroke-width="1.5"/>
  <circle cx="366" cy="135" r="22" fill="url(#cbtn)"/>
  <text x="366" y="141" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="404" y="140" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#3f3f46">Open TikTok &amp; tap Share</text>

  <g>
    <rect x="330" y="184" width="400" height="70" rx="16" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7" stroke-width="1.5"/>
    <circle cx="366" cy="219" r="22" fill="url(#cbtn)"/>
    <text x="366" y="225" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="404" y="224" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#3f3f46">Choose Copy Link</text>
  </g>

  <g>
    <rect x="330" y="268" width="400" height="70" rx="16" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7" stroke-width="1.5"/>
    <circle cx="366" cy="303" r="22" fill="url(#cbtn)"/>
    <text x="366" y="309" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="404" y="308" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#3f3f46">Paste into TikSaveHub</text>
  </g>

  <text x="530" y="392" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#3f3f46" text-anchor="middle">Step 1: Copy the TikTok link</text>
</svg>