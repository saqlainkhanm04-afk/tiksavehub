<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="tiktok video downloader without watermark tool">
  <defs>
    <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#007cf0" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#00dfd8" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#7928ca" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff0080" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#007cf0"/>
      <stop offset="1" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0080"/>
      <stop offset="1" stop-color="#ff9966"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#mesh)"/>

  <!-- Browser window -->
  <rect x="120" y="64" width="560" height="322" rx="18" fill="#ffffff" fill-opacity="0.96"/>
  <line x1="120" y1="104" x2="680" y2="104" stroke="#e4e4e7" stroke-width="1.5"/>
  <circle cx="150" cy="84" r="5" fill="#ff5f57"/>
  <circle cx="168" cy="84" r="5" fill="#febc2e"/>
  <circle cx="186" cy="84" r="5" fill="#28c840"/>

  <!-- URL input -->
  <rect x="140" y="132" width="420" height="52" rx="26" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <rect x="160" y="149" width="180" height="18" rx="9" fill="#e4e4e7"/>
  <rect x="352" y="149" width="120" height="18" rx="9" fill="#e4e4e7"/>

  <!-- Download button -->
  <rect x="576" y="132" width="100" height="52" rx="26" fill="url(#btn)"/>
  <path d="M626 142v18m0 0l-6-6m6 6l6-6" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="140" y1="206" x2="660" y2="206" stroke="#f0f0f0" stroke-width="2"/>

  <!-- Video preview -->
  <rect x="140" y="224" width="280" height="140" rx="14" fill="#171717"/>
  <circle cx="280" cy="294" r="28" fill="#ffffff" fill-opacity="0.18"/>
  <path d="M272 278v24l20-12z" fill="#ffffff"/>
  <rect x="368" y="326" width="36" height="20" rx="6" fill="#000000" fill-opacity="0.6"/>
  <text x="386" y="340" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">0:32</text>

  <!-- Result tiles -->
  <rect x="440" y="224" width="220" height="56" rx="12" fill="#f4f4f5"/>
  <rect x="458" y="240" width="96" height="24" rx="12" fill="#e4e4e7"/>
  <rect x="440" y="292" width="220" height="56" rx="12" fill="#fff7ed"/>
  <rect x="458" y="308" width="120" height="24" rx="12" fill="#ffedd5"/>
  <rect x="610" y="308" width="36" height="24" rx="12" fill="url(#hd)"/>
  <text x="628" y="324" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">HD</text>
</svg>
